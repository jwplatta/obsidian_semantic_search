name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies and build plugin
        working-directory: ./plugin
        run: |
          npm install
          npm run build

      - name: Build Docker image
        working-directory: ./server
        run: |
          docker build -t semantic-search-server .

      - name: Save Docker image as archive
        working-directory: ./server
        run: |
          docker save semantic-search-server | gzip > semantic-search-server.tar.gz

      - name: Prepare plugin files for release
        run: |
          mkdir release
          cp ./plugin/main.js ./release/
          cp ./plugin/manifest.json ./release/
          cp ./plugin/styles.css ./release/
          mv ./server/semantic-search-server.tar.gz ./release/

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: true
          prerelease: true

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/main.js
          asset_name: main.js
          asset_content_type: application/javascript

      - name: Upload manifest.json
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/manifest.json
          asset_name: manifest.json
          asset_content_type: application/json

      - name: Upload style.css
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/style.css
          asset_name: style.css
          asset_content_type: text/css

      - name: Upload Docker image
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/semantic-search-server.tar.gz
          asset_name: semantic-search-server.tar.gz
          asset_content_type: application/gzip